{% extends "base.html" %}{% block title %}Students{% endblock %}
{% block content %}
<div class="section-head"><h1>Student Records</h1></div>
<div class="twocol">
<div class="formbox"><h2>Add Student</h2><form method="post" action="{{url_for('add_student')}}">
<label>Student Name<input name="student_name" required></label>
<label>Admission / Roll No.<input name="admission_no" required></label>
<label>Class<input name="class_name"></label>
<label>Section<input name="section"></label><button>Add Student</button></form></div>
<div class="table-wrap"><table><tr><th>Name</th><th>Admission No.</th><th>Class</th><th>Section</th></tr>
{% for s in students %}<tr><td>{{s.student_name}}</td><td>{{s.admission_no}}</td><td>{{s.class_name}}</td><td>{{s.section}}</td></tr>{% endfor %}</table></div>
</div>
{% endblock %}
